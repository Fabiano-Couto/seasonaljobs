<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Monitor Seasonal Jobs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🎯 Monitor de Vagas</h2>
      <button id="open-site-btn" class="site-btn" title="Abrir seasonaljobs.dol.gov">🌐 Abrir site</button>
    </div>

    <div class="section">
      <label for="resume-link" class="section-title">🔗 Link do seu Currículo (G-Drive, LinkedIn):</label>
      <input type="url" id="resume-link" placeholder="https://drive.google.com/..." class="full-input">
      <p class="help-text">Será incluído automaticamente no final dos seus e-mails.</p>
    </div>

    <div class="section">
      <label class="section-title">🔍 Vagas Monitoradas:</label>
      <div class="input-group">
        <input type="text" id="keyword-input" placeholder="Nova palavra-chave (ex: Line Cook)">
        <button id="add-btn">Adicionar</button>
      </div>
      <ul id="keyword-list"></ul>
      <p class="help-text" id="keyword-hint">Clique numa vaga para editar a mensagem de e-mail.</p>
    </div>

    <div class="section template-section hidden" id="template-section">
      <div class="template-header">
        <label class="section-title">✉️ Mensagem para: <span id="current-keyword-label"></span></label>
        <button id="close-template-btn" class="close-btn" title="Fechar">✕</button>
      </div>
      <textarea id="email-body" rows="7"></textarea>
      <div id="save-status">Salvo automaticamente</div>
    </div>

    <div class="status-bar">
      <div class="status-info">
        <span id="status-text">Monitoramento Ativo</span>
        <span id="last-check-text"></span>
      </div>
      <button id="check-now-btn" class="check-btn" title="Verificar agora">↻</button>
      <label class="switch">
        <input type="checkbox" id="toggle-monitor" checked>
        <span class="slider round"></span>
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
